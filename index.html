<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      color: #1a1a2e;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* Input row */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #dde1ea;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    .input-row input:focus { border-color: #5b6af0; }

    .input-row button {
      padding: 12px 20px;
      background: #5b6af0;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover { background: #4452d8; }

    /* Filters */
    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filters button {
      flex: 1;
      padding: 8px;
      border: 2px solid #dde1ea;
      border-radius: 8px;
      background: #fff;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      color: #555;
      transition: all 0.15s;
    }

    .filters button.active {
      background: #5b6af0;
      border-color: #5b6af0;
      color: #fff;
    }

    /* Task list */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 2px solid #dde1ea;
      border-radius: 10px;
      padding: 12px 14px;
      transition: border-color 0.2s, opacity 0.2s;
    }

    .task-item.done { opacity: 0.55; }

    .task-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #5b6af0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 1rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 1.2rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #e05252; }

    /* Empty state */
    .empty {
      text-align: center;
      color: #aaa;
      padding: 32px 0;
      font-size: 0.95rem;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 0.85rem;
      color: #888;
    }

    .clear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      font-size: 0.85rem;
      text-decoration: underline;
      padding: 0;
    }

    .clear-btn:hover { color: #e05252; }
  </style>
</head>
<body>
  <div class="app">
    <h1>To-Do List</h1>

    <div class="input-row">
      <input type="text" id="task-input" placeholder="Add a new task..." maxlength="200" />
      <button id="add-btn">Add</button>
    </div>

    <div class="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <div class="footer">
      <span id="count-label"></span>
      <button class="clear-btn" id="clear-btn">Clear completed</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'todo-app-tasks';

    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let filter = 'all';

    const input = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const listEl = document.getElementById('task-list');
    const countLabel = document.getElementById('count-label');
    const clearBtn = document.getElementById('clear-btn');
    const filterBtns = document.querySelectorAll('.filters button');

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      save();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    }

    function setFilter(f) {
      filter = f;
      filterBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === f);
      });
      render();
    }

    function visibleTasks() {
      if (filter === 'active') return tasks.filter(t => !t.done);
      if (filter === 'completed') return tasks.filter(t => t.done);
      return tasks;
    }

    function render() {
      const visible = visibleTasks();
      listEl.innerHTML = '';

      if (visible.length === 0) {
        listEl.innerHTML = '<li class="empty">No tasks here.</li>';
      } else {
        visible.forEach(task => {
          const li = document.createElement('li');
          li.className = 'task-item' + (task.done ? ' done' : '');

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = task.done;
          cb.addEventListener('change', () => toggleTask(task.id));

          const span = document.createElement('span');
          span.className = 'task-text';
          span.textContent = task.text;

          const del = document.createElement('button');
          del.className = 'delete-btn';
          del.innerHTML = '&#x2715;';
          del.title = 'Delete task';
          del.addEventListener('click', () => deleteTask(task.id));

          li.append(cb, span, del);
          listEl.appendChild(li);
        });
      }

      const remaining = tasks.filter(t => !t.done).length;
      countLabel.textContent = `${remaining} item${remaining !== 1 ? 's' : ''} left`;
      clearBtn.style.visibility = tasks.some(t => t.done) ? 'visible' : 'hidden';
    }

    // Event listeners
    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    clearBtn.addEventListener('click', clearCompleted);
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => setFilter(btn.dataset.filter));
    });

    render();
  </script>
</body>
</html>
